{% extends "base.html" %}
{% block content %}
<section class="max-w-3xl mx-auto px-4 py-16">
    <div class="text-center mb-12">
        <h1 class="text-4xl font-extrabold mb-4">İletişim</h1>
        <p class="text-slate-600 text-lg">Sorularınız için bizimle hemen iletişime geçin.</p>
    </div>

    <!-- Flash Mesaj Bildirimi -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="mb-6 p-4 bg-emerald-100 border border-emerald-400 text-emerald-700 rounded-lg text-center font-medium">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Adınız Soyadınız</label>
                <input type="text" name="name" required class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-600">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">E-Posta Adresiniz</label>
                <input type="email" name="email" required class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-600">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Mesajınız</label>
                <textarea name="message" rows="4" required class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-600"></textarea>
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white font-medium py-3 rounded-lg hover:bg-indigo-700 transition">Gönder</button>
        </form>
    </div>
</section>
{% endblock %}
